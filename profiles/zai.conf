# Z.AI API profile
#
# Network-only mode:
#   web-netcheck zai
#
# Authenticated functional probe:
#   export ZAI_API_KEY='...'
#   export ZAI_PROBE_MODEL='glm-4.7'   # optional
#   web-netcheck zai
#
# The authenticated probe sends a tiny Anthropic-compatible request with
# max_tokens=1 to the same endpoint used by Claude/Anthropic-compatible clients.
# This may consume a negligible amount of API quota.

BASE_URL="https://api.z.ai/"

STATIC_HOSTS=(
    api.z.ai
    z.ai
    docs.z.ai
)

PROBE_URLS=(
    "https://api.z.ai/api/anthropic"
    "https://api.z.ai/api/paas/v4/"
)

# api.z.ai is an API endpoint, not a web application. Do not attempt HTML/CDN
# asset discovery here.
DISCOVER_HTML_HOSTS=0
CHECK_ASSETS=0

run_custom_probes() {
    local endpoint="https://api.z.ai/api/anthropic/v1/messages?beta=true"
    local model="${ZAI_PROBE_MODEL:-glm-4.7}"
    local body

    body=$(printf '{"model":"%s","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}' "$model")

    if [[ -n "${ZAI_API_KEY:-}" ]]; then
        echo "Z.AI Anthropic functional probe (authenticated, model=$model)"
        probe_http_request \
            POST \
            "$endpoint" \
            2xx \
            "$body" \
            -H "x-api-key: $ZAI_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json"
    else
        echo "Z.AI Anthropic route probe (unauthenticated)"
        echo "  Set ZAI_API_KEY for an end-to-end backend check."
        probe_http_request \
            POST \
            "$endpoint" \
            non5xx \
            "$body" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json"
    fi
}
