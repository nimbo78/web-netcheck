# Yandex home/search profile (https://ya.ru/)
#
# Static hosts cover the core page/search flow plus the main static,
# authentication and telemetry endpoints used by the Yandex homepage.
# Additional HTTPS hosts referenced by the current page are discovered
# automatically at runtime.

BASE_URL="https://ya.ru/"

STATIC_HOSTS=(
    ya.ru
    yandex.ru
    yastatic.net
    yastat.net
    passport.yandex.ru
    mc.yandex.ru
    avatars.mds.yandex.net
    favicon.yandex.net
)

DISCOVER_HTML_HOSTS=1
CHECK_ASSETS=1

# The homepage's substantial JS/CSS/static objects are primarily served
# from yastatic.net. Include same-site absolute assets as a fallback.
ASSET_URL_REGEX='^https://([^/]+\.)?(yastatic\.net|ya\.ru)/'

ASSET_COUNT=3
MIN_ASSET_SIZE=$((64 * 1024))
RANGE_SIZE=4096
