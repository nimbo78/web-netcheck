# Copy to /etc/web-netcheck/my-service.conf and edit.
BASE_URL="https://example.com/"

STATIC_HOSTS=(
    example.com
)

# Discover absolute https:// links from BASE_URL and test their hostnames.
DISCOVER_HTML_HOSTS=1

# Verify full downloads of random large assets referenced by BASE_URL.
CHECK_ASSETS=1
ASSET_URL_REGEX='^https://'
ASSET_COUNT=3
MIN_ASSET_SIZE=$((128 * 1024))
RANGE_SIZE=4096

# Optional JSON endpoint providing additional hostname strings.
META_URL=""
META_JQ_FILTER=""
