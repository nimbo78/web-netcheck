<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">web-netcheck — end-to-end HTTPS reachability and asset integrity checks</title>
  <desc id="desc">A dark technical dashboard showing DNS, TLS, HTTP and full asset integrity checks with a complete transfer and matching tail verification.</desc>

  <rect width="1200" height="520" rx="28" fill="#0B1220"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#22324A"/>

  <g opacity=".45" stroke="#1B2A40" stroke-width="1">
    <path d="M0 86H1200M0 172H1200M0 258H1200M0 344H1200M0 430H1200"/>
    <path d="M100 0V520M200 0V520M300 0V520M400 0V520M500 0V520M600 0V520M700 0V520M800 0V520M900 0V520M1000 0V520M1100 0V520"/>
  </g>

  <g transform="translate(70 74)">
    <rect x="0" y="0" width="148" height="34" rx="17" fill="#10283A" stroke="#1F587C"/>
    <circle cx="22" cy="17" r="5" fill="#66E3A4"/>
    <text x="38" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#B9C7D9">NETWORK PROBE</text>

    <text x="0" y="112" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#F7FAFC">web-netcheck</text>
    <text x="0" y="158" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="600" fill="#C6D2E1">Prove HTTPS works past the handshake.</text>
    <text x="0" y="196" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#8EA0B8">DNS · TLS · HTTP · CDN · full-body integrity</text>

    <g transform="translate(0 254)">
      <rect width="440" height="112" rx="18" fill="#0F1A2B" stroke="#26364F"/>
      <text x="24" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#6F86A2">$ web-netcheck github</text>
      <text x="24" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#66E3A4">RESULT overall=OK</text>
      <text x="24" y="89" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#9FB0C4">exit 0  •  machine-readable summary</text>
      <rect x="24" y="98" width="10" height="2" fill="#66E3A4"/>
    </g>
  </g>

  <g transform="translate(650 58)">
    <rect width="480" height="404" rx="22" fill="#0E1828" stroke="#2A3C56"/>
    <text x="28" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#7F93AC">CHECK PIPELINE</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <g transform="translate(28 76)">
        <circle cx="12" cy="12" r="10" fill="#143324" stroke="#2A8D5A"/>
        <path d="M7 12l3 3 7-8" fill="none" stroke="#66E3A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="18" font-size="18" fill="#E7EEF7">DNS</text>
        <text x="388" y="18" text-anchor="end" font-size="16" font-weight="700" fill="#66E3A4">OK</text>
      </g>

      <g transform="translate(28 124)">
        <circle cx="12" cy="12" r="10" fill="#143324" stroke="#2A8D5A"/>
        <path d="M7 12l3 3 7-8" fill="none" stroke="#66E3A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="18" font-size="18" fill="#E7EEF7">TLS / HTTPS</text>
        <text x="388" y="18" text-anchor="end" font-size="16" font-weight="700" fill="#66E3A4">OK</text>
      </g>

      <g transform="translate(28 172)">
        <circle cx="12" cy="12" r="10" fill="#143324" stroke="#2A8D5A"/>
        <path d="M7 12l3 3 7-8" fill="none" stroke="#66E3A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="18" font-size="18" fill="#E7EEF7">HTTP response</text>
        <text x="388" y="18" text-anchor="end" font-size="16" font-weight="700" fill="#66E3A4">200</text>
      </g>

      <g transform="translate(28 228)">
        <text x="0" y="0" font-size="14" font-weight="700" fill="#7F93AC">FULL BODY</text>
        <rect x="0" y="16" width="396" height="18" rx="9" fill="#18263A"/>
        <rect x="0" y="16" width="396" height="18" rx="9" fill="#5EB1FF"/>
        <line x1="96" y1="12" x2="96" y2="38" stroke="#F3C969" stroke-width="2"/>
        <text x="102" y="11" font-size="12" fill="#F3C969">16 KiB</text>
        <text x="396" y="58" text-anchor="end" font-size="15" font-weight="700" fill="#66E3A4">COMPLETE</text>
      </g>

      <g transform="translate(28 324)">
        <rect x="0" y="0" width="396" height="48" rx="12" fill="#102234" stroke="#244D6F"/>
        <text x="18" y="30" font-size="16" fill="#BFD1E5">tail / Range verification</text>
        <text x="374" y="30" text-anchor="end" font-size="16" font-weight="700" fill="#66E3A4">MATCH</text>
      </g>
    </g>
  </g>

  <g transform="translate(70 480)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#647A95">
    <text>Designed for partial filtering, broken CDN paths, DPI/TSPU symptoms, and API reachability checks.</text>
  </g>
</svg>