<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Built-in web-netcheck profiles</title>
  <desc id="desc">Three profile cards for GitHub, Yandex and Z.AI with their principal check types.</desc>
  <rect width="1200" height="260" rx="24" fill="#0B1220"/>
  <rect x="1" y="1" width="1198" height="258" rx="23" fill="none" stroke="#22324A"/>
  <text x="54" y="54" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="800" fill="#F7FAFC">Built-in profiles</text>
  <text x="54" y="82" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#8EA0B8">Different services need different proof.</text>
  <g transform="translate(54 112)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g>
      <rect width="334" height="104" rx="16" fill="#0F1A2B" stroke="#2B3E59"/>
      <circle cx="26" cy="27" r="8" fill="#66E3A4"/>
      <text x="46" y="33" font-size="20" font-weight="800" fill="#E7EEF7">github</text>
      <text x="22" y="65" font-size="14" fill="#91A4BA">HTML + metadata + CDN assets</text>
      <text x="22" y="88" font-size="14" fill="#5EB1FF">full-body + tail integrity</text>
    </g>
    <g transform="translate(362 0)">
      <rect width="334" height="104" rx="16" fill="#0F1A2B" stroke="#2B3E59"/>
      <circle cx="26" cy="27" r="8" fill="#F3C969"/>
      <text x="46" y="33" font-size="20" font-weight="800" fill="#E7EEF7">ya</text>
      <text x="22" y="65" font-size="14" fill="#91A4BA">homepage + resource discovery</text>
      <text x="22" y="88" font-size="14" fill="#5EB1FF">Range-aware asset checks</text>
    </g>
    <g transform="translate(724 0)">
      <rect width="334" height="104" rx="16" fill="#0F1A2B" stroke="#2B3E59"/>
      <circle cx="26" cy="27" r="8" fill="#5EB1FF"/>
      <text x="46" y="33" font-size="20" font-weight="800" fill="#E7EEF7">zai</text>
      <text x="22" y="65" font-size="14" fill="#91A4BA">API routes + POST probe</text>
      <text x="22" y="88" font-size="14" fill="#5EB1FF">optional authenticated check</text>
    </g>
  </g>
</svg>